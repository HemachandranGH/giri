    const Icon = ({ name, size = 18, className = "" }) => {
      const ref = useRef(null);

          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          if (className) i.className = className;
          ref.current.appendChild(i);
          if (window.lucide) lucide.createIcons({ targets: [i] });
        }
      }, [name, className]);
      return <span ref={ref} style={{ display: 'inline-flex', width: size, height: size, alignItems: 'center', justifyContent: 'center' }} />;

    function useReveal() {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver(
          ([entry]) => { if (entry.isIntersecting) { setVisible(true); io.disconnect(); } },
          { threshold: 0.15 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return [ref, visible];
    }

    function Reveal({ children, className = "", delay = 0 }) {
      const [ref, visible] = useReveal();
      return (
        <div
          ref={ref}
          className={className}
          style={{
            opacity: visible ? 1 : 0,
            transform: visible ? "translateY(0)" : "translateY(24px)",
            transition: `opacity 0.7s ease ${delay}ms, transform 0.7s ease ${delay}ms`,
          }}
        >
          {children}
        </div>
      );
    }

                    <ul className="space-y-2 text-sm text-slate-300 mb-4">
                      {exp.points.map((p) => (
                        <li key={p} className="flex gap-2"><span className="text-indigo-400 mt-1">▸</span><span>{p}</span></li>
                      ))}
                    </ul>
                    <div className="flex flex-wrap gap-2">
                      {exp.tech.map((t) => (
                        <span key={t} className="px-2.5 py-1 rounded-md text-xs font-mono bg-white/5 border border-white/10 text-slate-300">{t}</span>
                      ))}
                    </div>
                  </div>
                </Reveal>
              ))}
            </div>
          </Section>

          <Section id="projects" eyebrow="Projects" title="Things I've built" subtitle="Every project below is drawn directly from real work — a full-stack marketplace and an embedded IoT build.">
            <div className="grid md:grid-cols-2 gap-7">
              {RESUME.projects.map((p, i) => (
                <Reveal key={p.title} delay={i * 100}>
                  <ProjectCard project={p} />
                </Reveal>
              ))}
            </div>
          </Section>

          <Section id="education" eyebrow="Education" title="Academic background" subtitle="">
            <div className="relative pl-8 border-l border-white/10 space-y-8">
              {RESUME.education.map((ed, i) => (
                <Reveal key={ed.degree} delay={i * 90} className="relative">
                  <span className="absolute -left-[41px] top-1 w-4 h-4 rounded-full bg-[#0B1120] border-2 border-purple-400" />
                  <div className="rounded-2xl border border-white/10 bg-white/[0.03] p-6 flex flex-wrap items-start justify-between gap-3">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <GraduationCap size={16} className="text-purple-400" />
                        <h3 className="font-display font-bold text-slate-100">{ed.degree}</h3>
                      </div>
                      <p className="text-sm text-slate-300">{ed.school}</p>
                    </div>
                    <div className="text-right shrink-0">
                      <p className="font-mono text-xs text-slate-300">{ed.period}</p>
                      <p className="text-sm font-semibold text-indigo-400 mt-1">{ed.detail}</p>
                    </div>
                  </div>
                </Reveal>
              ))}
            </div>
          </Section>

          <Section id="achievements" eyebrow="Achievements" title="Certifications & recognition" subtitle="">
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {RESUME.certifications.map((c, i) => (
                <Reveal key={c.name} delay={i * 70}>
                  <div className="rounded-2xl border border-white/10 bg-white/[0.03] p-6 h-full hover:-translate-y-1 transition-transform duration-300">
                    <BookOpen size={20} className="text-cyan-400 mb-3" />
                    <p className="font-semibold text-slate-100 text-sm">{c.name}</p>
                    <p className="text-xs text-slate-300 mt-1">{c.issuer}</p>
                  </div>
                </Reveal>
              ))}
              {RESUME.achievements.map((a, i) => (
                <Reveal key={a.title} delay={(i + 2) * 70}>
                  <div className="rounded-2xl border border-white/10 bg-white/[0.03] p-6 h-full hover:-translate-y-1 transition-transform duration-300">
                    {a.icon === "trophy" ? <Trophy size={20} className="text-amber-400 mb-3" /> : <Star size={20} className="text-amber-400 mb-3" />}
                    <p className="font-semibold text-slate-100 text-sm">{a.title}</p>
                    <p className="text-xs text-slate-300 mt-1">{a.detail}</p>
                  </div>
                </Reveal>
              ))}
              {RESUME.extracurricular.map((e, i) => (
                <Reveal key={e.title} delay={(i + 4) * 70}>
                  <div className="rounded-2xl border border-white/10 bg-white/[0.03] p-6 h-full hover:-translate-y-1 transition-transform duration-300">
                    <Users size={20} className="text-indigo-400 mb-3" />
                    <p className="font-semibold text-slate-100 text-sm">{e.title}</p>
                    <p className="text-xs text-slate-300 mt-1">{e.detail}</p>
                  </div>
                </Reveal>
              ))}
            </div>

            <Reveal delay={200} className="mt-12">
              <h3 className="font-display font-bold text-slate-100 mb-5 flex items-center gap-2"><GitBranch size={18} className="text-indigo-400"/> Find me online</h3>
              <div className="flex flex-wrap gap-4">
                {RESUME.codingProfiles.map((cp) => (
                  <a key={cp.name} href={cp.url} target="_blank" rel="noreferrer"
                    className="grad-border flex items-center gap-3 rounded-xl border border-white/10 bg-white/[0.03] px-5 py-4 hover:-translate-y-0.5 transition-transform duration-300 min-w-[200px]">
                    {cp.name === "GitHub" ? <Github size={20} className="text-slate-200"/> : <Linkedin size={20} className="text-slate-200"/>}
                    <div>
                      <p className="text-sm font-semibold text-slate-100">{cp.name}</p>
                      <p className="text-xs text-slate-300">{cp.handle}</p>
                    </div>
                    <ArrowUpRight size={14} className="ml-auto text-slate-300"/>
                  </a>
                ))}
              </div>
            </Reveal>
          </Section>

          <Section id="contact" eyebrow="Contact" title="Let's build something" subtitle="Open to internships, entry-level roles, and interesting collaborations.">
            <div className="grid lg:grid-cols-5 gap-8">
              <Reveal className="lg:col-span-2 space-y-4">
                <ContactRow icon={Mail} label="Email" value={RESUME.email} href={`mailto:${RESUME.email}`} />
                <ContactRow icon={Phone} label="Phone" value={RESUME.phone} href={`tel:${RESUME.phone}`} />
                <ContactRow icon={Linkedin} label="LinkedIn" value="in/giri-prasath" href={RESUME.linkedin} />
                <ContactRow icon={Github} label="GitHub" value="GiriPrasath28" href={RESUME.github} />
                <ContactRow icon={MapPin} label="Location" value={RESUME.location} href={null} />
                <div className="rounded-xl overflow-hidden border border-white/10 h-40 bg-white/[0.03] flex items-center justify-center text-slate-400 text-xs font-mono">
                  map placeholder — Pollachi, Tamil Nadu
                </div>
              </Reveal>

              <Reveal delay={100} className="lg:col-span-3">
                <form onSubmit={handleFormSubmit} className="rounded-2xl border border-white/10 bg-white/[0.03] p-6 sm:p-8 space-y-4">
                  <div className="grid sm:grid-cols-2 gap-4">
                    <input required value={formState.name} onChange={(e) => setFormState({ ...formState, name: e.target.value })}
                      placeholder="Your name" className="bg-[#0B1120] border border-white/10 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-indigo-400 transition-colors" />
                    <input required type="email" value={formState.email} onChange={(e) => setFormState({ ...formState, email: e.target.value })}
                      placeholder="Your email" className="bg-[#0B1120] border border-white/10 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-indigo-400 transition-colors" />
                  </div>
                  <input required value={formState.subject} onChange={(e) => setFormState({ ...formState, subject: e.target.value })}
                    placeholder="Subject" className="w-full bg-[#0B1120] border border-white/10 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-indigo-400 transition-colors" />
                  <textarea required rows={5} value={formState.message} onChange={(e) => setFormState({ ...formState, message: e.target.value })}
                    placeholder="Message" className="w-full bg-[#0B1120] border border-white/10 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-indigo-400 transition-colors resize-none" />
                  <button type="submit" className="w-full flex items-center justify-center gap-2 px-5 py-3.5 rounded-lg text-sm font-semibold text-white bg-gradient-to-r from-indigo-500 to-purple-500 hover:opacity-90 transition-opacity">
                    <Send size={15} /> Send Message
                  </button>
                  {sent && <p className="text-xs text-emerald-400 text-center font-mono">Message ready — connect a form backend (e.g. Formspree) to deliver it.</p>}
                </form>
              </Reveal>
            </div>
          </Section>

          <footer className="no-print border-t border-white/5 py-8 px-6 sm:px-10">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-300">
              <p>© {new Date().getFullYear()} {RESUME.name}. All rights reserved.</p>
              <div className="flex items-center gap-4">
                <a href={RESUME.github} target="_blank" rel="noreferrer" className="hover:text-slate-200"><Github size={16}/></a>
                <a href={RESUME.linkedin} target="_blank" rel="noreferrer" className="hover:text-slate-200"><Linkedin size={16}/></a>
                <a href={`mailto:${RESUME.email}`} className="hover:text-slate-200"><Mail size={16}/></a>
              </div>
              <p>Built with ❤️ using React</p>
            </div>
          </footer>
        </div>
      );
    }

    function SkillBar({ name, level }) {
      const [ref, visible] = useReveal();
      return (
        <div ref={ref}>
          <div className="flex justify-between text-xs mb-1.5">
            <span className="text-slate-200 font-medium">{name}</span>
            <span className="text-slate-300 font-mono">{level}%</span>
          </div>
          <div className="h-1.5 rounded-full bg-white/5 overflow-hidden">
            <div className="skill-bar-fill h-full rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-cyan-400"
              style={{ width: visible ? `${level}%` : "0%" }} />
          </div>
        </div>
      );
    }

    function ContactRow({ icon: Icon, label, value, href }) {
      const content = (
        <div className="flex items-center gap-3 rounded-xl border border-white/10 bg-white/[0.03] px-4 py-3.5 hover:bg-white/[0.06] transition-colors">
          <div className="w-9 h-9 rounded-lg bg-indigo-500/15 flex items-center justify-center text-indigo-400 shrink-0"><Icon size={16} /></div>
          <div>
            <p className="text-[11px] uppercase tracking-wider text-slate-300 font-mono">{label}</p>
            <p className="text-sm text-slate-100 font-medium">{value}</p>
          </div>
        </div>
      );
      return href ? <a href={href} target="_blank" rel="noreferrer">{content}</a> : content;
    }

    function ProjectCard({ project }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="grad-border relative rounded-2xl border border-white/10 bg-white/[0.03] overflow-hidden hover:-translate-y-1.5 transition-transform duration-300 h-full flex flex-col">
          {project.featured && (
            <span className="absolute top-4 right-4 text-[10px] font-mono uppercase tracking-wider px-2 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-400/20">
              Featured
            </span>
          )}
          <div className="h-36 bg-gradient-to-br from-indigo-500/20 via-purple-500/15 to-cyan-500/10 flex items-center justify-center">
            <Terminal size={34} className="text-slate-300" />
          </div>
          <div className="p-6 flex flex-col flex-1">
            <div className="flex items-baseline justify-between gap-2 mb-2">
              <h3 className="font-display font-bold text-slate-100">{project.title}</h3>
              <span className="font-mono text-[11px] text-slate-300 shrink-0">{project.duration}</span>
            </div>
            <p className="text-sm text-slate-300 leading-relaxed mb-4">{project.description}</p>
            <div className="flex flex-wrap gap-2 mb-5">
              {project.tags.map((t) => (
                <span key={t} className="px-2.5 py-1 rounded-md text-xs font-mono bg-white/5 border border-white/10 text-slate-300">{t}</span>
              ))}
            </div>

            {open && (
              <ul className="space-y-1.5 text-xs text-slate-300 mb-5 border-t border-white/5 pt-4">
                {project.features.map((f) => (
                  <li key={f} className="flex gap-2"><span className="text-cyan-400 mt-0.5">▸</span><span>{f}</span></li>
                ))}
              </ul>
            )}

            <div className="mt-auto flex items-center gap-3 pt-2">
              <a href={project.github} target="_blank" rel="noreferrer"
                className="flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-full border border-white/15 text-slate-100 hover:bg-white/5 transition-colors">
                <Github size={13} /> Code
              </a>
              {project.demo && (
                <a href={project.demo} target="_blank" rel="noreferrer"
                  className="flex items-center gap-1.5 text-xs font-semibold px-3.5 py-2 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white hover:opacity-90 transition-opacity">
                  <ExternalLink size={13} /> Live Demo
                </a>
              )}
              <button onClick={() => setOpen((o) => !o)} className="ml-auto text-xs font-semibold text-indigo-400 hover:text-indigo-300">
                {open ? "Show less" : "Learn more"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<Portfolio />);
  </script>
</body>
</html>
